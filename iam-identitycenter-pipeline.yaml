AWSTemplateFormatVersion: "2010-09-09"
Description: "Create a CI/CD pipeline for AWS Identity Center permission sets and assignments"

## +-------
## | Metadata
## +--------------
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "General Parameters"
        Parameters:
          - nameConvention
          - s3NameConvention
          - mgmtAccountId
          - mgmtNameConvention
      - Label:
          default: "Source Repository"
        Parameters:
          - providerType
          - fullRepositoryId
          - s3BucketCodeBucket
          - s3BucketCodeKey
      - Label:
          default: "CloudWatch Logs"
        Parameters:
          - cwLGRetentionInDays
      - Label:
          default: "SNS Notifications"
        Parameters:
          - codeBuildErrorEmailAddress

## +-------
## | Parameters
## +--------------
Parameters:
  # Name of the project
  nameConvention:
    Description: "Prefix that will be used to name resources in this stack within the AWS IAM Identity Center Delegated Admin account (e.g. roles, events, pipeline)"
    Type: String
    Default: "iam-idc"
    MaxLength: 21
  s3NameConvention:
    Description: "Prefix that will be used to name S3 buckets.  Recommended to mirror nameConvention, but MUST use all lowercase"
    Type: String
    Default: "iam-idc"
  mgmtAccountId:
    Description: "Account ID of the management account. (e.g. 123456789123)"
    Type: String
    Default: ""
  mgmtNameConvention:
    Description: "Prefix (nameConvention) used when deploying iam-identitycenter-organization.yaml in the management account. Only the role <prefix>-assumerole-write of that account is allowed to start this pipeline"
    Type: String
    Default: "iam-identitycenter"
  cwLGRetentionInDays:
    Description: "Specify the retention time in days for logs within CloudWatch Log Groups"
    Type: String
    Default: 365
  providerType:
    Description: "Repository provider. CodeCommit creates an AWS CodeCommit repository in this account. The other values use an AWS CodeConnections connection to an external repository"
    Type: String
    Default: "GitHub"
    AllowedValues:
      - CodeCommit
      - Bitbucket
      - GitHub
      - GitHubEnterpriseServer
      - GitLab
      - GitLabSelfManaged
  fullRepositoryId:
    Description: "External providers only (ignored for CodeCommit): full repository ID in the format user/repository_name"
    Type: String
    Default: user/iam-idc-repository 
  s3BucketCodeBucket:
    Description: "CodeCommit only (optional): S3 bucket with a .zip of this solution used to seed the main branch of the new repository. Leave empty to create an empty repository and push the code to its main branch later"
    Type: String
    Default: ""
  s3BucketCodeKey:
    Description: "CodeCommit only (optional): key of the .zip file in the S3 bucket above"
    Type: String
    Default: "iam-identitycenter.zip"
  codeBuildErrorEmailAddress:
    Description: "Optional: If you wish to receive a notification upon a CodeBuild error, enter an email address and accept the topic subscription. (e.g. user@emaildomain.com)"
    Type: String
    Default: user@example.com



## +-------
## | Conditions
## +--------------
Conditions:
  codeBuildErrorEmailProvided:
    Fn::Not:
      - Fn::Equals:
          - ""
          - Ref: codeBuildErrorEmailAddress
  useCodeCommit:
    Fn::Equals:
      - "CodeCommit"
      - Ref: providerType
  useExternalRepository:
    Fn::Not:
      - Condition: useCodeCommit
  codeCommitInitialCodeProvided:
    Fn::And:
      - Condition: useCodeCommit
      - Fn::Not:
          - Fn::Equals:
              - ""
              - Ref: s3BucketCodeBucket

Resources:
  ## +-------
  ## | KMS Key (CodeBuild Error SNS Topic)
  ## | Customer managed key used to encrypt the messages published to CodeBuildSNSTopic.
  ## | Usage is delegated to IAM principals of this account through SNS (same model as the
  ## | AWS managed key aws/sns). The publisher (PipelineToSNSRole) gets kms:GenerateDataKey*
  ## | and kms:Decrypt in PipelineToSNSRolePolicy. If an AWS service (e.g. EventBridge) ever
  ## | publishes to the topic, add its service principal to this key policy as described in
  ## | https://docs.aws.amazon.com/sns/latest/dg/sns-key-management.html
  ## +---------------
  KmsKeySNS:
    Type: AWS::KMS::Key
    Condition: codeBuildErrorEmailProvided
    Properties:
      Description: KMS key for the CodeBuild error notifications SNS topic
      Enabled: true
      EnableKeyRotation: true
      KeyUsage: ENCRYPT_DECRYPT
      KeyPolicy:
        Version: "2012-10-17"
        Id: sns-kms-policy
        Statement:
          - Sid: Allow use of the key through SNS by IAM principals of this account
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:CreateGrant
              - kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref AWS::AccountId
                kms:ViaService: !Sub sns.${AWS::Region}.amazonaws.com
          - Sid: Allow access for Key Administrators
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: "*"
      Tags:
        - Key: "Name"
          Value: !Sub "${nameConvention}-sns"

  KmsKeyAliasSNS:
    Type: AWS::KMS::Alias
    Condition: codeBuildErrorEmailProvided
    Properties:
      AliasName: !Sub "alias/${nameConvention}/sns"
      TargetKeyId: !Ref KmsKeySNS

  ## +-------
  ## | SNS Topics (CodeBuild Error)
  ## +---------------
  CodeBuildSNSTopic:
    Type: AWS::SNS::Topic
    Condition: codeBuildErrorEmailProvided
    Properties:
      TopicName: !Sub "${nameConvention}-CodeBuildSNSTopic"
      KmsMasterKeyId: !Ref KmsKeySNS

  CodeBuildSNSSubscription:
    Condition: codeBuildErrorEmailProvided
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref codeBuildErrorEmailAddress
      TopicArn: !Ref CodeBuildSNSTopic

  CodeBuildSNSTopicPolicy:
    Condition: codeBuildErrorEmailProvided
    Type: AWS::SNS::TopicPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action:
              - sns:Publish
            Resource:
              Ref: CodeBuildSNSTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Sub "${AWS::AccountId}"
      Topics:
        - !Ref CodeBuildSNSTopic



  ## +-------
  ## | CloudWatch Log Groups (Lambda and CodeBuild)
  ## +---------------
  PipelineLogGroupAssignments:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: "CloudWatchLogs LogGroup should specify a KMS Key Id to encrypt the log data"
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${nameConvention}-assignments"
      RetentionInDays: !Ref cwLGRetentionInDays
      Tags: 
        - Key: "Name"
          Value: !Sub "${nameConvention}-assignments"

  PipelineLogGroupTemplateValidation:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84 
            reason: "CloudWatchLogs LogGroup should specify a KMS Key Id to encrypt the log data"
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${nameConvention}-templatevalidation"
      RetentionInDays: !Ref cwLGRetentionInDays
      Tags: 
        - Key: "Name"
          Value: !Sub "${nameConvention}-templatevalidation"

  PipelineLogGroupPermissionSet:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84 
            reason: "CloudWatchLogs LogGroup should specify a KMS Key Id to encrypt the log data"
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${nameConvention}-permissionset"
      RetentionInDays: !Ref cwLGRetentionInDays
      Tags: 
        - Key: "Name"
          Value: !Sub "${nameConvention}-permissionset"

  SNSLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: codeBuildErrorEmailProvided
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84 
            reason: "CloudWatchLogs LogGroup should specify a KMS Key Id to encrypt the log data"
    Properties:
      LogGroupName: !Sub "/aws/lambda/${nameConvention}-PipelineToSNSLambda"
      RetentionInDays: !Ref cwLGRetentionInDays
      Tags: 
        - Key: "Name"
          Value: !Sub "${nameConvention}-PipelineToSNSLambda"

  ## +-------
  ## | IAM Role (Pipeline Failure Notification)
  ## +---------------
  PipelineToSNSRole:
    Type: "AWS::IAM::Role"
    Condition: codeBuildErrorEmailProvided
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "The IAM Role name is specified as an explicit for use within the scripting"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "lambda.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      Description: "This role grants necessary permissions to Lambda"
      Path: "/"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      RoleName: !Sub "${nameConvention}-PipelineToSNSRole"
      Tags: 
        - Key: "Name"
          Value: !Sub "${nameConvention}-PipelineToSNSRole"

  PipelineToSNSRolePolicy:
    Type: "AWS::IAM::ManagedPolicy"
    Condition: codeBuildErrorEmailProvided
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "The IAM Role name is specified as an explicit for use within the scripting"
    Properties:
      Description: "This policy grants necessary permissions to PipelineToSNSRole"
      ManagedPolicyName: !Sub "${nameConvention}-PipelineToSNSRolePolicy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SNSPublish
            Effect: Allow
            Action: sns:Publish
            Resource: !Ref CodeBuildSNSTopic
          # Required to publish to the KMS encrypted topic (publisher side permissions)
          - Sid: KMSPermission
            Effect: Allow
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
            Resource: !GetAtt KmsKeySNS.Arn
          - Sid: CodebuildLogs
            Effect: Allow
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${nameConvention}*:*"
            Action:
              - "logs:GetLogEvents"
      Roles:
        - Ref: "PipelineToSNSRole"

  ## +-------
  ## | Lambda (Pipeline Failure Notifications)
  ## +---------------
  PipelineToSNSLambda:
    Type: AWS::Lambda::Function
    Condition: codeBuildErrorEmailProvided
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W92
            reason: "Lambda functions should define ReservedConcurrentExecutions to reserve simultaneous executions"
          - id: W89
            reason: "Lambda functions should be deployed inside a VPC"
          - id: W58
            reason: "Lambda functions require permission to write CloudWatch Logs"
    Properties:
      FunctionName: !Sub "${nameConvention}-PipelineToSNSLambda"
      Code:
        ZipFile:
          Fn::Sub: |
            import base64
            import boto3
            import gzip
            import json
            import logging
            import os
            import re

            from botocore.exceptions import ClientError

            logging.basicConfig(level=logging.INFO)
            logger = logging.getLogger(__name__)


            def logpayload(event):
                logger.setLevel(logging.DEBUG)
                logger.debug(event['awslogs']['data'])
                compressed_payload = base64.b64decode(event['awslogs']['data'])
                uncompressed_payload = gzip.decompress(compressed_payload)
                log_payload = json.loads(uncompressed_payload)
                return log_payload


            def error_details(payload):
                error_msg = ""
                ansi_escape = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
                log_events = payload['logEvents']
                logger.debug(payload)
                loggroup = payload['logGroup']
                logstream = payload['logStream']
                lambda_func_name = loggroup.split('/')
                logger.debug(f'LogGroup: {loggroup}')
                logger.debug(f'Logstream: {logstream}')
                logger.debug(f'Function name: {lambda_func_name[3]}')
                logger.debug(log_events)
                for log_event in log_events:
                    error_msg += log_event['message']
                error_msg = ansi_escape.sub('', error_msg)
                logger.debug('Message: %s' % error_msg.split("\n"))
                return loggroup, logstream, error_msg, lambda_func_name

            # Get the log events from the log stream
            def acquire_log(lgroup, lstream):
                cloudwatch_logs = boto3.client('logs')
                log_events_response_dict = cloudwatch_logs.get_log_events(
                    logGroupName=lgroup,
                    logStreamName=lstream,
                    limit=100,
                    startFromHead=False
                )
                log_events_response = str(log_events_response_dict)
                log_events_response = (re.sub("\{'timestamp': [0-9]+, |\'ingestionTime': [0-9]+\}, ", '', log_events_response))
                log_events_response = (re.sub(",", '\n', log_events_response))
                return log_events_response
                
            def publish_message(loggroup, logstream, error_msg, lambda_func_name, buildlog):
                sns_arn = os.environ['snsARN']  # Getting the SNS Topic ARN passed in by the environment variables.
                snsclient = boto3.client('sns')
                try:
                    message = ""
                    message += "\nIAM Identity Center Automation Pipeline Error Summary" + "\n"
                    message += "\n##########################################################\n\n"
                    message += "CloudWatch LogGroup Name: " + str(loggroup) + "\n\n"
                    message += "CloudWatch LogStream: " + str(logstream) + "\n\n"
                    message += "CloudWatch Subscription Filter Event: " + str(error_msg.split("\n")) + "\t\n\n"
                    message += "CloudWatch Events (Top 100): \n"
                    message += buildlog

                    # Sending the notification...
                    snsclient.publish(
                        TargetArn=sns_arn,
                        Subject='Execution error for IAM Identity Center Automation Pipeline',
                        Message=message
                    )
                except ClientError as e:
                    logger.error("An error occurred: %s" % e)

            def lambda_handler(event, context):
                pload = logpayload(event)
                lgroup, lstream, errmessage, lambdaname = error_details(pload)
                buildlog = acquire_log(lgroup, lstream)
                publish_message(lgroup, lstream, errmessage, lambdaname,buildlog)

      Description: A function to pull events from CloudWatch Logs and send to SNS
      Handler: index.lambda_handler
      Role: !GetAtt PipelineToSNSRole.Arn
      Runtime: python3.11
      Environment:
        Variables:
          snsARN: !Ref CodeBuildSNSTopic
      Tags: 
        - Key: "Name"
          Value: !Sub "${nameConvention}-PipelineToSNSLambda"

  # Allows CloudWatch Logs to invoke the function, restricted to the subscription filters of the
  # CodeBuild log groups created by this stack (SourceArn + SourceAccount).
  # logs.amazonaws.com is the service principal documented for subscription filters:
  # https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/SubscriptionFilters.html#LambdaFunctionExample
  PipelineToSNSLambdaPermission:
    Type: AWS::Lambda::Permission
    Condition: codeBuildErrorEmailProvided
    Properties:
      FunctionName: !GetAtt PipelineToSNSLambda.Arn
      Action: lambda:InvokeFunction
      Principal: logs.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${nameConvention}-*:*"

  ## +-------
  ## | CW Log Subscriptions
  ## +---------------
  PipelineLambdaSubscriptionAssignments:
    Type: AWS::Logs::SubscriptionFilter
    Condition: codeBuildErrorEmailProvided
    DependsOn: PipelineToSNSLambdaPermission
    Properties:
      FilterName: !Sub "${nameConvention}-assignments"
      DestinationArn: !GetAtt PipelineToSNSLambda.Arn
      FilterPattern: '?ERROR ?Error'
      LogGroupName: !Ref PipelineLogGroupAssignments

  PipelineLambdaSubscriptionValidation:
    Type: AWS::Logs::SubscriptionFilter
    Condition: codeBuildErrorEmailProvided
    DependsOn: PipelineToSNSLambdaPermission
    Properties:
      FilterName: !Sub "${nameConvention}-validation"
      DestinationArn: !GetAtt PipelineToSNSLambda.Arn
      FilterPattern: '?ERROR ?Error'
      LogGroupName: !Ref PipelineLogGroupTemplateValidation

  PipelineLambdaSubscriptionPermissionSet:
    Type: AWS::Logs::SubscriptionFilter
    Condition: codeBuildErrorEmailProvided
    DependsOn: PipelineToSNSLambdaPermission
    Properties:
      FilterName: !Sub "${nameConvention}-permissionset"
      DestinationArn: !GetAtt PipelineToSNSLambda.Arn
      FilterPattern: '?ERROR ?Error'
      LogGroupName: !Ref PipelineLogGroupPermissionSet

  ## +-------
  ## | CodePipeline
  ## +---------------
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !GetAtt PipelineRole.Arn
      Name: !Sub "${nameConvention}-pipeline"
      PipelineType: "V2"
      ArtifactStore:
        Type: S3
        Location: !Ref artifactsBucket
      Stages:
        # CodeCommit: change detection comes from the triggerPipelineCodeChange EventBridge rule
        # External providers: CodeConnections detects pushes to the branch by default
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: "1"
                Provider: !If
                  - useCodeCommit
                  - CodeCommit
                  - CodeStarSourceConnection
              Configuration: !If
                - useCodeCommit
                - RepositoryName: !GetAtt IdentityCenterRepository.Name
                  BranchName: main
                  PollForSourceChanges: false
                  OutputArtifactFormat: CODE_ZIP
                - FullRepositoryId: !Ref fullRepositoryId
                  BranchName: main
                  ConnectionArn: !GetAtt IdentityCenterConnection.ConnectionArn
                  OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: RepositoryOutput
              RunOrder: 1
        - Name: TemplateValidation
          Actions:
            - Name: TemplateValidation
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: "1"
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref CodebuildTemplateValidation
              RunOrder: 1
              InputArtifacts:
                - Name: RepositoryOutput
              OutputArtifacts:
                - Name: TemplateValidation
        - Name: Deploy
          Actions:
            - Name: PermissionSet
              RunOrder: 1
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: "1"
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref CodebuildPermissionSet
              InputArtifacts:
                - Name: RepositoryOutput
              OutputArtifacts:
                - Name: PermissionSetOutput
            - Name: Assignments
              RunOrder: 2
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: "1"
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref CodebuildAssignments
              InputArtifacts:
                - Name: RepositoryOutput
              OutputArtifacts:
                - Name: AssignmentsOutput
      Tags: 
        - Key: "Name"
          Value: !Sub "${nameConvention}-pipeline"

  ## +-------
  ## | IAM Role (CodePipeline)
  ## +---------------
  PipelineRole:
    Type: "AWS::IAM::Role"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "ListAllMyBuckets requires * in Resource"
          - id: W28
            reason: "Fixed name required to future references"
    Properties:
      RoleName: !Sub ${nameConvention}-codepipeline-write
      Description: "Role for code pipeline"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codepipeline.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: "/"
      Policies:
        - PolicyName: !Sub ${nameConvention}-codepipeline-write
          PolicyDocument:
            Statement:
              - Sid: CodeBuildAccess
                Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource:
                  - !Sub "arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${nameConvention}-*"
              - Sid: S3AllAccess
                Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                Resource:
                  - "*"
              - Sid: BucketPermissions
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetBucketPolicy
                  - s3:GetObject
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${artifactsBucket}/*"
                  - !Sub "arn:${AWS::Partition}:s3:::${artifactsBucket}*"
              - !If
                - useCodeCommit
                - Sid: CodeCommitAccess
                  Effect: Allow
                  Action:
                    - codecommit:CancelUploadArchive
                    - codecommit:GetBranch
                    - codecommit:GetCommit
                    - codecommit:GetRepository
                    - codecommit:GetUploadArchiveStatus
                    - codecommit:UploadArchive
                  Resource:
                    - !GetAtt IdentityCenterRepository.Arn
                - Sid: CodeConnection
                  Effect: Allow
                  Action:
                    - codestar-connections:UseConnection
                  Resource:
                    - !GetAtt IdentityCenterConnection.ConnectionArn

      Tags: 
        - Key: "Name"
          Value: !Sub "${nameConvention}-codepipeline-write"

  ## +-------
  ## | Repository (Identity Center Management)
  ## | providerType CodeCommit: CodeCommit repository in this account
  ## | Other providerType values: CodeConnections connection to the external repository
  ## +--------------

  # Retained on stack deletion/replacement: the repository is the source of truth for
  # permission sets and assignments. Code from S3 is only imported when the repository is created
  IdentityCenterRepository:
    Type: AWS::CodeCommit::Repository
    Condition: useCodeCommit
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub "${nameConvention}-repository"
      RepositoryDescription: "Repository to control AWS IAM Identity Center permission sets and assignments"
      Code: !If
        - codeCommitInitialCodeProvided
        - BranchName: main
          S3:
            Bucket: !Ref s3BucketCodeBucket
            Key: !Ref s3BucketCodeKey
        - !Ref AWS::NoValue
      Tags:
        - Key: "Name"
          Value: !Sub "${nameConvention}-repository"

  IdentityCenterConnection:
    Type: AWS::CodeConnections::Connection
    Condition: useExternalRepository
    Properties:
      ConnectionName: !Sub "${nameConvention}-repository"
      ProviderType: !Ref providerType

  ## +-------
  ## | EventBridge (CodeCommit Trigger)
  ## | Pipeline triggers only support CodeConnections, so pushes to the CodeCommit main branch
  ## | start the pipeline through this rule. Keep referenceName equal to the Source action BranchName
  ## +---------------
  triggerPipelineCodeChange:
    Type: AWS::Events::Rule
    Condition: useCodeCommit
    Properties:
      Name: !Sub "${nameConvention}-codechange-trigger"
      Description: "Rule to trigger the CodePipeline based on changes in the main branch of the CodeCommit repository"
      EventPattern:
        source:
          - "aws.codecommit"
        detail-type:
          - "CodeCommit Repository State Change"
        resources:
          - !GetAtt IdentityCenterRepository.Arn
        detail:
          event:
            - referenceCreated
            - referenceUpdated
          referenceType:
            - branch
          referenceName:
            - main
      State: ENABLED
      Targets:
        - Arn: !Sub "arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}"
          RoleArn: !GetAtt triggerPipelineCodeChangeRole.Arn
          Id: "CodePipelineTrigger"

  ## +-------
  ## | IAM Role (CodeCommit Trigger)
  ## +---------------
  triggerPipelineCodeChangeRole:
    Type: AWS::IAM::Role
    Condition: useCodeCommit
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Fixed name required to future references"
    Properties:
      RoleName: !Sub ${nameConvention}-codecommittrigger-write
      Description: "Role that EventBridge uses to start the pipeline on CodeCommit changes"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action:
              - "sts:AssumeRole"
            Condition:
              StringEquals:
                aws:SourceAccount: !Sub "${AWS::AccountId}"
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${nameConvention}-codechange-trigger"
      Path: "/"
      Policies:
        - PolicyName: !Sub ${nameConvention}-codecommittrigger-write
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: CodePipelinePerm
                Effect: Allow
                Action:
                  - codepipeline:StartPipelineExecution
                Resource:
