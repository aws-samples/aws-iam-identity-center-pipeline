              - Sid: Logs
                Effect: Allow
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${nameConvention}*:*"
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
              - Sid: Buckets
                Effect: Allow
                Action:
                  - "s3:PutObject"
                  - "s3:GetObject"
                  - "s3:GetObjectVersion"
                  - "s3:GetBucketAcl"
                  - "s3:GetBucketLocation"
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${artifactsBucket}*/*"
              - Sid: CodeBuild
                Effect: Allow
                Action:
                  - "codebuild:CreateReportGroup"
                  - "codebuild:CreateReport"
                  - "codebuild:UpdateReport"
                  - "codebuild:BatchPutTestCases"
                  - "codebuild:BatchPutCodeCoverages"
                Resource:
                  - !Sub "arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:report-group/${nameConvention}*"
              - Sid: SpecificPermissions
                Effect: Allow
                Action:
                  - sso:ProvisionPermissionSet
                  - sso:ListPermissionSets
                  - sso:DeletePermissionsPolicy
                  - sso:PutPermissionsPolicy
                  - sso:PutInlinePolicyToPermissionSet
                  - sso:DeleteInlinePolicyToPermissionSet
                  - sso:DescribePermissionSet
                  - sso:GetPermissionSet
                  - sso:AttachManagedPolicyToPermissionSet
                  - sso:CreatePermissionSet
                  - sso:UpdatePermissionSet
                  - sso:ListTagsForResource
                  - sso:ListManagedPoliciesInPermissionSet
                  - sso:DescribeAccountAssignmentDeletionStatus
                  - sso:DeletePermissionSet
                  - sso:TagResource
                  - sso:DetachManagedPolicyFromPermissionSet
                  - sso:DeleteInlinePolicyFromPermissionSet
                  - sso:AttachCustomerManagedPolicyReferenceToPermissionSet
                  - sso:DeletePermissionsBoundaryFromPermissionSet
                  - sso:ListCustomerManagedPolicyReferencesInPermissionSet
                  - sso:PutPermissionsBoundaryToPermissionSet
                  - sso:DetachCustomerManagedPolicyReferenceFromPermissionSet
                  - sso:GetPermissionsBoundaryForPermissionSet
                  - sso:ListInstances
                Resource:
                  - "*"
              - Sid: KMSPermission
                Effect: Allow
                Action:
                  - "kms:Encrypt"
                  - "kms:Decrypt"
                  - "kms:ReEncrypt*"
                  - "kms:GenerateDataKey*"
