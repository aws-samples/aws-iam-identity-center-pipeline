                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${nameConvention}*:*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${nameConvention}*"
              - Sid: Buckets
                Effect: Allow
                Action:
                  - "s3:PutObject"
                  - "s3:GetBucketPolicy"
                  - "s3:GetObject"
                  - "s3:GetBucketAcl"
                  - "s3:GetBucketLocation"
                  - "s3:ListBucket"
                  - "s3:DeleteObject"
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${artifactsBucket}*/*"
                  - !Sub "arn:${AWS::Partition}:s3:::${tfStateBucket}*/*"
              - Sid: CodeBuild
                Effect: Allow
                Action:
                  - "codebuild:CreateReportGroup"
                  - "codebuild:CreateReport"
                  - "codebuild:UpdateReport"
                  - "codebuild:BatchPutTestCases"
                  - "codebuild:BatchPutCodeCoverages"
                Resource:
                  - !Sub "arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:report-group/${nameConvention}*"
              - Sid: SpecificPermissions
                Effect: Allow
                Action:
                  - "sso:ListPermissionSets"
                  - "sso:ListTagsForResource"
                  - "sso:DescribePermissionSet"
                  - "sso:ListInstances"
                  - "sso:DescribeAccountAssignmentCreationStatus"
                  - "organizations:ListAccounts"
                  - "organizations:ListAccountsForParent"
                  - "organizations:ListOrganizationalUnitsForParent"
                  - "organizations:ListRoots"
                  - "sso:CreateAccountAssignment"
                  - "sso:DeleteAccountAssignment"
                  - "sso:ListAccountsForProvisionedPermissionSet"
                  - "sso:DescribeAccountAssignmentDeletionStatus"
                  - "sso:ListAccountAssignments"
                  - "identitystore:ListGroups"
                  - "identitystore:ListUsers"
                  - "iam:GetSAMLProvider"
                  - "iam:CreateRole"
                  - "iam:PutRolePolicy"
                  - "iam:AttachRolePolicy"
                  - "iam:GetRole"
                  - "iam:ListAttachedRolePolicies"
                  - "iam:ListRolePolicies"
                Resource:
                  - "*"
              - Sid: KMSPermission
                Effect: Allow
                Action:
                  - "kms:Encrypt"
                  - "kms:Decrypt"
