  ## +-------
  ## | S3 Bucket Artifact
  ## +---------------
  tfStateBucket:
    Type: "AWS::S3::Bucket"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W35
            reason: "There is no need to enable log in this bucket."
    Properties:
      BucketName: !Sub "${s3NameConvention}-${AWS::AccountId}-tf-state"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: "aws:kms"
              KMSMasterKeyID: !Ref KmsKeyS3
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags: 
        - Key: "Name"
          Value: !Sub "${nameConvention}-tf-state"

  tfStateBucketPolicy:
    Type: "AWS::S3::BucketPolicy"
    Properties:
      Bucket: !Ref tfStateBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: HTTPSOnly
            Effect: Deny
            Principal:
              AWS: "*"
            Action:
              - s3:*
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${tfStateBucket}/*
              - !Sub arn:${AWS::Partition}:s3:::${tfStateBucket}
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: AllowCodeBuild
            Effect: Allow
            Principal:
              AWS: !GetAtt RoleCodebuildAssignments.Arn
            Action:
              - s3:Get*
              - s3:Put*
              - s3:List*
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${tfStateBucket}/*
              - !Sub arn:${AWS::Partition}:s3:::${tfStateBucket}

  ## +-------
  ## | S3 Bucket Artifact
  ## +---------------
  artifactsBucket:
    Type: "AWS::S3::Bucket"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W35
            reason: "There is no need to enable log in this bucket."
    Properties:
      BucketName: !Sub "${s3NameConvention}-${AWS::AccountId}-artfcs"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: "aws:kms"
              KMSMasterKeyID: !Ref KmsKeyS3
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags: 
        - Key: "Name"
          Value: !Sub "${nameConvention}-artfcs"

  artifactsBucketPolicy:
    Type: "AWS::S3::BucketPolicy"
    Properties:
      Bucket: !Ref artifactsBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: HTTPSOnly
            Effect: Deny
            Principal:
              AWS: "*"
            Action:
              - s3:*
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${artifactsBucket}/*
              - !Sub arn:${AWS::Partition}:s3:::${artifactsBucket}
            Condition:
              Bool:
                aws:SecureTransport: false

  KmsKeyAliasS3:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${nameConvention}/s3"
      TargetKeyId: !Ref KmsKeyS3

  KmsKeyS3:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS Key for S3
      Enabled: True
      EnableKeyRotation: false
      KeyUsage: ENCRYPT_DECRYPT
      KeyPolicy:
        Version: "2012-10-17"
        Id: s3-kms-policy
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:CreateGrant
              - kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Sub "${AWS::AccountId}"
                kms:ViaService: !Sub s3.${AWS::Region}.amazonaws.com
          - Sid: Allow direct access to key metadata to the account
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action:
              - kms:Describe*
              - kms:Get*
              - kms:List*
              - kms:RevokeGrant
            Resource: "*"
          - Sid: Allow access for Key Administrators
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: "*"
      Tags: 
        - Key: "Name"
          Value: !Sub "${nameConvention}-s3"

  ## +-------
  ## | EventBridge (Trigger - Code Changes)
  ## +---------------

  #Event definition
  eventPipelineCodeChangeTrigger:
    Condition: useCodeCommitSource  
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${nameConvention}-codechange-trigger
      Description: "Rule to trigger the CodePipeline based on code changes"
      EventPattern:
        source:
          - aws.codecommit
        detail-type:
          - "CodeCommit Repository State Change"
        resources:
          - !Sub "arn:${AWS::Partition}:codecommit:${AWS::Region}:${AWS::AccountId}:${nameConvention}-repository"
        detail:
          event:
            - referenceCreated
            - referenceUpdated
          referenceType:
            - branch
          referenceName:
            - !Ref branchName
      Targets:
        - Arn: !Sub arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${nameConvention}-pipeline
          RoleArn: !GetAtt rolePipelineCodeChangeTrigger.Arn
          Id: codepipeline-CodeChangeTrigger

  ## +-------
  ## | IAM Role (EventBridge Trigger - Code Change)
  ## +---------------

  rolePipelineCodeChangeTrigger:
    Condition: useCodeCommitSource  
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${nameConvention}-eventbridge-codechange-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole

  policyPipelineCodeChangeTrigger:
    Condition: useCodeCommitSource  
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${nameConvention}-eventbridge-codechange-policy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - "codepipeline:StartPipelineExecution"
            Resource: !Sub arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${nameConvention}-pipeline
      Roles: 
        - !Ref rolePipelineCodeChangeTrigger

  ## +-------
  ## | IAM Role (Lambda Trigger - Move Account)
  ## +---------------
  LambdaTriggerRole:
    Type: "AWS::IAM::Role"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Fixed name required to future references"
    Properties:
      RoleName: !Sub ${nameConvention}-pipelinetrigger-write
      Description: "Role that the Lambda will use to trigger pipeline"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub ${mgmtAccountId}
            Action:
              - "sts:AssumeRole"
      Path: "/"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: !Sub ${nameConvention}-pipelinetrigger
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: CodePipelinePerm
                Effect: Allow
                Action:
                  - "codepipeline:StartPipelineExecution"
                Resource:
                  - !Sub arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${nameConvention}-pipeline
              - !If
                - useCodeCommitSource
                - Sid: CodeComitPerm
                  Effect: Allow
                  Action:
                    - "codecommit:List*"
                    - "codecommit:Get*"
                  Resource:
                    - !Sub "arn:${AWS::Partition}:codecommit:${AWS::Region}:${AWS::AccountId}:${nameConvention}-repository"
                - !Ref AWS::NoValue
              - !If
                - useCodeCommitSource
                - !Ref AWS::NoValue
                - Sid: CodeConnection
                  Effect: Allow
                  Action:
                    - "codestar-connections:UseConnection"
                  Resource:
