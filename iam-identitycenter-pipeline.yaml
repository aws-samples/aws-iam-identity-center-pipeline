            Action:
              - "sts:AssumeRole"
      Tags: 
        - Key: "Name"
          Value: !Sub "${nameConvention}-assignments-write"


  ## +-------
  ## | S3 Bucket (Server Access Logs)
  ## | Destination of the server access logs of tfStateBucket and artifactsBucket.
  ## | Constraints from https://docs.aws.amazon.com/AmazonS3/latest/userguide/enable-server-access-logging.html:
  ## |   - the destination bucket must use SSE-S3 (AES256), SSE-KMS is not supported for log delivery
  ## |   - the destination bucket must not have Object Lock / default retention
  ## |   - the destination bucket must not log to itself (log loop), so access logging is not enabled here
  ## +---------------
  accessLogsBucket:
    Type: "AWS::S3::Bucket"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W35
            reason: "Destination bucket of the server access logs. Logging it to itself creates a log loop, which AWS does not recommend."
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: "Destination bucket of the server access logs. Logging it to itself creates a log loop, which AWS does not recommend."
      guard:
        SuppressedRules:
          - S3_BUCKET_LOGGING_ENABLED  # destination bucket of the server access logs (log loop)
          - S3_BUCKET_DEFAULT_LOCK_ENABLED  # buckets with Object Lock cannot receive server access logs
    Properties:
      BucketName: !Sub "${s3NameConvention}-${AWS::AccountId}-access-logs"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: "AES256"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAccessLogs
            Status: Enabled
            ExpirationInDays: 365
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: "Name"
          Value: !Sub "${nameConvention}-access-logs"

  # Grants the S3 log delivery service principal write access, restricted to logs coming from the
  # two buckets of this stack. The source ARNs are built from the bucket names (instead of !Ref) to
  # avoid a circular dependency: the source buckets depend on this policy existing before their
  # LoggingConfiguration is applied. Keep them in sync with the BucketName of tfStateBucket and artifactsBucket.
  accessLogsBucketPolicy:
    Type: "AWS::S3::BucketPolicy"
    Properties:
      Bucket: !Ref accessLogsBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: HTTPSOnly
            Effect: Deny
            Principal:
              AWS: "*"
            Action:
              - s3:*
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${accessLogsBucket}/*
              - !Sub arn:${AWS::Partition}:s3:::${accessLogsBucket}
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: S3ServerAccessLogsPolicy
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action:
              - s3:PutObject
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${accessLogsBucket}/*
            Condition:
              ArnLike:
                aws:SourceArn:
                  - !Sub arn:${AWS::Partition}:s3:::${s3NameConvention}-${AWS::AccountId}-tf-state
                  - !Sub arn:${AWS::Partition}:s3:::${s3NameConvention}-${AWS::AccountId}-artfcs
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  ## +-------
  ## | S3 Bucket Terraform State
  ## +---------------
  tfStateBucket:
    Type: "AWS::S3::Bucket"
    # The log delivery permission must exist before S3 accepts the LoggingConfiguration
    DependsOn: accessLogsBucketPolicy
    Properties:
      BucketName: !Sub "${s3NameConvention}-${AWS::AccountId}-tf-state"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: "aws:kms"
              KMSMasterKeyID: !Ref KmsKeyS3
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LoggingConfiguration:
        DestinationBucketName: !Ref accessLogsBucket
        LogFilePrefix: tf-state/
      Tags: 
        - Key: "Name"
          Value: !Sub "${nameConvention}-tf-state"

  tfStateBucketPolicy:
    Type: "AWS::S3::BucketPolicy"
    Properties:
      Bucket: !Ref tfStateBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: HTTPSOnly
            Effect: Deny
            Principal:
              AWS: "*"
            Action:
              - s3:*
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${tfStateBucket}/*
              - !Sub arn:${AWS::Partition}:s3:::${tfStateBucket}
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: AllowCodeBuild
            Effect: Allow
            Principal:
              AWS: !GetAtt RoleCodebuildAssignments.Arn
            Action:
              - s3:Get*
              - s3:Put*
              - s3:List*
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${tfStateBucket}/*
              - !Sub arn:${AWS::Partition}:s3:::${tfStateBucket}

  ## +-------
  ## | S3 Bucket Artifact
  ## +---------------
  artifactsBucket:
    Type: "AWS::S3::Bucket"
    # The log delivery permission must exist before S3 accepts the LoggingConfiguration
    DependsOn: accessLogsBucketPolicy
    Properties:
      BucketName: !Sub "${s3NameConvention}-${AWS::AccountId}-artfcs"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: "aws:kms"
              KMSMasterKeyID: !Ref KmsKeyS3
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LoggingConfiguration:
        DestinationBucketName: !Ref accessLogsBucket
        LogFilePrefix: artifacts/
      Tags: 
        - Key: "Name"
          Value: !Sub "${nameConvention}-artfcs"

  artifactsBucketPolicy:
    Type: "AWS::S3::BucketPolicy"
    Properties:
      Bucket: !Ref artifactsBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: HTTPSOnly
            Effect: Deny
            Principal:
              AWS: "*"
            Action:
              - s3:*
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${artifactsBucket}/*
              - !Sub arn:${AWS::Partition}:s3:::${artifactsBucket}
            Condition:
              Bool:
                aws:SecureTransport: false

  KmsKeyAliasS3:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${nameConvention}/s3"
      TargetKeyId: !Ref KmsKeyS3

  KmsKeyS3:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS Key for S3
      Enabled: True
      # Automatic rotation is transparent for existing objects: KMS keeps the previous key material
      EnableKeyRotation: true
      KeyUsage: ENCRYPT_DECRYPT
      KeyPolicy:
        Version: "2012-10-17"
        Id: s3-kms-policy
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:CreateGrant
              - kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Sub "${AWS::AccountId}"
                kms:ViaService: !Sub s3.${AWS::Region}.amazonaws.com
          - Sid: Allow direct access to key metadata to the account
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action:
              - kms:Describe*
              - kms:Get*
              - kms:List*
              - kms:RevokeGrant
            Resource: "*"
          - Sid: Allow access for Key Administrators
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: "*"
      Tags: 
        - Key: "Name"
          Value: !Sub "${nameConvention}-s3"

  LambdaTriggerRole:
    Type: "AWS::IAM::Role"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Fixed name required to future references"
    Properties:
      RoleName: !Sub ${nameConvention}-pipelinetrigger-write
      Description: "Role that the Lambda will use to trigger pipeline"
      # Only the Lambda execution role created by iam-identitycenter-organization.yaml
      # (<mgmtNameConvention>-assumerole-write) in the management account can assume this role.
      # The account root is kept as Principal, with the role pinned through aws:PrincipalArn, because
      # this stack is deployed before the management account stack: IAM rejects a trust policy that
      # names a role that does not exist yet ("Invalid principal in policy").
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${mgmtAccountId}:root
            Action:
              - "sts:AssumeRole"
            Condition:
              ArnEquals:
                aws:PrincipalArn: !Sub arn:${AWS::Partition}:iam::${mgmtAccountId}:role/${mgmtNameConvention}-assumerole-write
      Path: "/"
      Policies:
        - PolicyName: !Sub ${nameConvention}-pipelinetrigger
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: CodePipelinePerm
                Effect: Allow
                Action:
                  - codepipeline:StartPipelineExecution
                Resource:
                  - !Sub arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${nameConvention}-pipeline
      Tags: 
        - Key: "Name"
          Value: !Sub "${nameConvention}-pipelinetrigger-write"          